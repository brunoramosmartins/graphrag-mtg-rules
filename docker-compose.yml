# Phase 0 — minimal compose: Neo4j with a persistent volume and a healthcheck.
# The full stack (Streamlit app + Arize Phoenix) is added in Phase 7 behind
# compose profiles, so `docker compose up` here brings up only the database.
services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-mtg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt (Python driver)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
      NEO4J_PLUGINS: '["apoc"]'
      # Modest footprint for a 16 GB laptop (see roadmap "Premissas declaradas").
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Neo4j Browser endpoint answers 200 once the DB is accepting connections.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── E-002 only: the MetaQA calibration instance ────────────────────────────
  # A separate *server*, not a separate database. Neo4j Community serves
  # exactly one user database, and the alternative — a namespace inside the
  # Magic graph — is what E-008's teardown used when it deleted three real CR
  # rules. Different port, different password, different process.
  #
  # Deliberately volume-less. The 135k MetaQA triples live in the container's
  # writable layer, so teardown is destroying the container and there is no
  # DELETE query anywhere near the corpus:
  #
  #   docker compose --profile metaqa up -d --wait
  #   docker rm -f graphrag-mtg-neo4j-metaqa      # this is the teardown
  #
  # Teardown names the CONTAINER, not the profile. `--profile metaqa` *adds*
  # this service to the default set rather than restricting to it, so
  # `docker compose --profile metaqa rm -sf` removes the corpus container
  # too — it did, on 2026-09-03. The corpus survived only because its data
  # lives in a named volume; this one has none, by design, which is exactly
  # why the two must never be targeted by the same command.
  #
  # No APOC: the loader is plain UNWIND/MERGE Cypher.
  neo4j-metaqa:
    profiles: ["metaqa"]
    image: neo4j:5-community
    container_name: graphrag-mtg-neo4j-metaqa
    # Not `unless-stopped`: a disposable instance must not come back after a
    # reboot, or it stops being disposable.
    restart: "no"
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/${METAQA_NEO4J_PASSWORD:-metaqa-throwaway}"
      # Smaller than the corpus instance: one untyped KB, no text properties.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Phase 7: the trace viewer ──────────────────────────────────────────────
  # Behind a profile so `docker compose up` stays the database alone, which is
  # what every ETL and evaluation script actually needs. Bring it up only when
  # you want to look at a trace:
  #
  #   docker compose --profile observability up -d --wait
  #   docker rm -f graphrag-mtg-phoenix          # this is the teardown
  #
  # Teardown names the CONTAINER, for the reason spelled out above the MetaQA
  # instance: `--profile observability` *adds* this service to the default set
  # rather than restricting to it, so a profile-scoped `rm -sf` takes the
  # corpus database down with it. That happened once already, on 2026-09-03.
  #
  # Port 6006 serves both the UI and the OTLP/HTTP collector at /v1/traces —
  # the same endpoint `.env.example` sets OTEL_EXPORTER_OTLP_ENDPOINT to, and
  # the same one `observability/tracing.py` falls back to. Three places, one
  # value, on purpose: a viewer running where the exporter is not pointed is
  # indistinguishable from instrumentation that was never added.
  phoenix:
    profiles: ["observability"]
    # Unpinned, and knowingly so: the pin is taken from the digest of the
    # image that produced the README's trace screenshot, and that run has not
    # happened yet. Until then this line is the one part of the stack that is
    # not reproducible, and saying so beats inventing a version tag.
    image: arizephoenix/phoenix:latest
    container_name: graphrag-mtg-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # UI, and OTLP/HTTP at /v1/traces
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6006 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  neo4j_data:
  neo4j_logs:
  phoenix_data:
