name: CI

# What this pipeline is for, stated once so a green badge is not read as
# more than it is: CI checks that the code runs and that every stage of the
# evaluation pipeline still agrees with the next about its formats. It
# checks **the wiring, not the quality**.
#
# No job here holds an API key. A key in CI is a secret exposed on every
# pull request, including one opened from a fork, and the smoke therefore
# runs with a fake generator and a fake judge. That means CI cannot tell
# whether the prompt still works, whether the judge still agrees with a
# human, or whether any arm is better than any other. Those are E-001's
# job, on real questions, with a judge that is itself gated on the
# correctness ceiling. See docs/evaluation.md.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Unit tests (no Neo4j)
        run: pytest -m "not integration"
      # Arm A indexes documents and reads them: no graph, no network, no
      # key. It is the one arm whose whole pipeline fits in this job, and
      # running it here means a broken corpus build or a broken report
      # fails on every pull request rather than on the next real run.
      - name: Evaluation smoke — arm A (no key, no database)
        run: python scripts/run_eval.py run --smoke --arm A --mode lexical --figures runs/smoke

  integration:
    name: Integration tests (Neo4j service container)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -m integration
      # After the tests, not before. The integration tests build and remove
      # their own `pytest-` namespaced nodes; loading the fixture first
      # would leave the two sharing a database for no reason, and the
      # ordering costs nothing.
      - name: Load the smoke fixture graph
        run: python scripts/load_smoke_graph.py
      # Arms B and C traverse, so they need a graph with something in it.
      # B is graph-only and C adds the text half — between them they cover
      # the router's two branches, including the NO_SEED path that arm B
      # takes on a question no traversal can reach.
      - name: Evaluation smoke — arms B and C (no key)
        run: |
          python scripts/run_eval.py run --smoke --arm B
          python scripts/run_eval.py run --smoke --arm C --text tfidf
